name: CI

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    check:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x, 24.x]

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - run: npm ci
            - name: Check that released compat fixtures are unchanged
              run: npm run compat:immutable
            - name: Check that fixtures pushed earlier are unchanged
              if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
              env:
                  COMPAT_BASE: ${{ github.event.before }}
              run: npm run compat:immutable
            - run: npm run lint
            - run: npm test
            - run: npm run build
